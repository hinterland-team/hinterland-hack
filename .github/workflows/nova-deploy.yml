name: Nova Deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Redeploy {0}', inputs.sha || github.sha) || github.event.head_commit.message }}
on:
  push:
    branches: [main]
    # only builds when an app folder changes, so other commits don't send the robot an update
    paths:
      - "robot-app/**"
      - "nova-deploy.json"
      - ".github/workflows/nova-deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit sha to rebuild (empty = latest main)"
        required: false
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: nova-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: hinterland-team/nova-deploy-action@main
        with:
          sha: ${{ inputs.sha }}
          keystore: ${{ secrets.NOVA_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          app-properties: ${{ secrets.NOVA_APP_PROPERTIES }}
          github-token: ${{ github.token }}
